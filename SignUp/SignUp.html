<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="stylesheet" href="./SignUp.css">
    <script src="./SignUp.js" defer></script>
</head>
<body>
    <!-- Background Video -->
    <video src="../Images/Travel.mp4" autoplay muted loop id="background_video"></video>

    <!-- Signup Container -->
    <div class="overlay">
        <div class="signup-container">
            <div class="signup-header">
                <h2>Create an Account</h2>
                <p>Sign up to get started</p>
            </div>
            <form id="signupForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first-name">First Name</label>
                        <input type="text" id="first-name" name="first-name" placeholder="Enter First Name" required>
                        <div id="first-name-error" class="error-message"></div>
                    </div>
                    <div class="form-group">
                        <label for="last-name">Last Name</label>
                        <input type="text" id="last-name" name="last-name" placeholder="Enter Last Name" required>
                        <div id="last-name-error" class="error-message"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Enter Email" required>
                        <div id="email-error" class="error-message"></div>
                    </div>
                    <div class="form-group">
                        <label for="phone">Mobile Number</label>
                        <input type="text" id="phone" name="phone" placeholder="Enter Mobile Number" required>
                        <div id="mobile-error" class="error-message"></div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob" required>
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <!-- Password and Confirm Password Fields Side by Side -->
                    <div class="form-group password-group">
                        <label for="password">Password</label>
                        <div class="password-container">
                            <input type="password" id="password" name="password" placeholder="Enter your Password" required>
                            <button type="button" id="togglePassword" aria-label="Show/Hide Password">👁️</button>
                        </div>
                        <div id="password-error" class="error-message"></div>
                    </div>

                    <div class="form-group password-group">
                        <label for="confirm-password">Confirm Password</label>
                        <div class="password-container">
                            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your Password" required>
                            <button type="button" id="toggleConfirmPassword" aria-label="Show/Hide Password">👁️</button>
                        </div>
                        <div id="confirm-password-error" class="error-message"></div>
                    </div>
                </div>

                <div class="form-row">
                    <label for="captcha" id="captcha_label">Captcha</label>
                    <div id="captcha-wrapper">
                        <div class="captcha-wrapper">
                            <div class="captcha-box" id="captcha-display">nan45i</div>
                            <input type="text" id="captcha" name="captcha" placeholder="Enter Captcha" required>
                            <button type="button" id="refreshCaptcha" aria-label="Refresh Captcha">🔄 Refresh</button>
                        </div>
                        <div id="captcha-error" class="error-message"></div>
                    </div>
                </div>

                <button type="submit" class="signup-btn">Sign Up</button>

                <div class="login">
                    Already have an account? <a href="../index.html">Login Now</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
