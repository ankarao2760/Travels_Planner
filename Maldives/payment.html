<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment - Maldives Travel</title>
    <link rel="stylesheet" href="payment.css" />
</head>
<body>
    <header>
        <nav class="navbar">
            <img src="../Images/Logo.png" id="logo" />
            <ul class="nav-links">
                <a href="../Travel/Travel.html">Home</a>
                <a href="#destinations">Destinations</a>
                <a href="#packages">Packages</a>
                <a href="#contact">Contact</a>
            </ul>
        </nav>
    </header>

    <section id="payment-section">
        <h2>Confirm Your Payment</h2>
        <div id="booking-info">
            <h3>Booking Summary</h3>
            <p><strong>Package: </strong><span id="selected-package"></span></p>
            <p><strong>Booking ID: </strong><span id="booking-id"></span></p>
            <p><strong>Total Price: </strong><span id="total-price"></span></p>
        </div>

        <form id="payment-form">
            <div class="form-group">
                <label for="card-name">Name on Card:</label>
                <input type="text" id="card-name" required />
            </div>

            <div class="form-group">
                <label for="card-number">Card Number:</label>
                <input type="text" id="card-number" pattern="\d{16}" required />
            </div>

            <div class="form-group">
                <label for="expiry-date">Expiry Date:</label>
                <input type="month" id="expiry-date" required />
            </div>

            <div class="form-group">
                <label for="cvv">CVV:</label>
                <input type="text" id="cvv" pattern="\d{3}" required />
            </div>

            <button type="submit" class="pay-now-btn">Pay Now</button>
        </form>

        <p id="payment-status"></p>
    </section>

    <footer>
        <p>Nani Travels Planner &copy; 2025. All Rights Reserved.</p>
    </footer>

    
    <script>
        // Retrieve booking details from localStorage
        const bookingId = localStorage.getItem('bookingId');
        const packageCategory = localStorage.getItem('packageCategory');
    
        if (!bookingId || !packageCategory) {
            alert("Error: Missing booking details. Please try again.");
            window.location.href = "../Travel/Travel.html";  // Redirect back to home if details are missing
        }
    
        // Display booking info dynamically
        document.getElementById('booking-id').textContent = bookingId;
      
        let packageName = '';
        let totalPrice = 0;
      
        if (packageCategory === 'low') {
            packageName = 'Budget Retreat';
            totalPrice = '$399';
        } else if (packageCategory === 'mid') {
            packageName = 'Island Escape';
            totalPrice = '$999';
        } else if (packageCategory === 'high') {
            packageName = 'Luxury Island Experience';
            totalPrice = '$2999';
        }
      
        document.getElementById('selected-package').textContent = packageName;
        document.getElementById('total-price').textContent = totalPrice;
      
        // Payment form submission handler
        document.getElementById('payment-form').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent the form from refreshing the page
            
            setTimeout(function () {
                // Simulate a successful payment and redirect to the Thank You page with bookingId
                window.location.href = "thank_you.html?bookingId=" + bookingId;
            }, 2000);
        });
    </script>
</body>
</html>
